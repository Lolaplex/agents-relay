[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-gateway"
version = "0.1.0"
description = "HTTP and Telegram gateway to agents-harness runner.loop (stdlib only)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agents-gateway = "agents_gateway.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
